<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image · Department of Agricultural Engineering</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Department of Agricultural Engineering</h1>
            <p class="subtitle">RVS Institute of Technology</p>
        </div>
    </header>

    <div class="container">
        <div class="upload-card">
            <h2>Upload an Image</h2>
            <form method="POST" enctype="multipart/form-data">
                <input type="file" name="file" accept=".png,.jpg,.jpeg,.gif" required>
                <input class="btn" type="submit" value="Upload">
            </form>
            <p><a href="{{ url_for('index') }}">&larr; Back to Gallery</a></p>
        </div>
    </div>
</body>
</html>
